[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ytb-edit"
version = "0.1.0"
description = "Télécharge des vidéos YouTube publiques et en extrait des segments sans réencodage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "yt-dlp[default]",
    "superqt>=0.6",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.gui-scripts]
ytb-edit = "ytb_edit.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "ffmpeg: nécessite ffmpeg/ffprobe (ignoré s'ils sont absents)",
    "network: accède à YouTube (désactivé par défaut, lancer avec -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
